<g class="relation" data-from="waterschap-scheldestromen" data-to="nature-managers" data-kind="authority over" data-curvature="0.2"><title>Waterschap Scheldestromen authority over Nature managers on the island (Natuurmonumenten, Staatsbosbeheer): Sets the water levels of the island's nature areas in its water level plans, agreed with the site managers, on Duiveland with Staatsbosbeheer for Dijkwater and the Ouwerkerkse Kreek; there its study for the plan (2021) finds that a lower level in Dijkwater would do the nature area disproportionate drought damage, and proposes coupling the farm parcel in its level area to the lower one beside it instead. On Schouwen, in consultation with the site managers, it can hold water in the nature areas in extreme rain, relieving the polder system.</title><path class="link-path" d="M 2370.4 1293.0 Q 2091.5 1600.7 1677.2 1631.2" fill="none" stroke="#333333" stroke-width="4" marker-end="url(#arrow-authority-over)"/></g>

<script type="application/json" id="data">{"actors": [{"id": "arable-farmers", "label": "Arable farmers on Schouwen-Duiveland", "type": "Business in the food chain", "level": "Local / Provincial / Regional", "sector": "Arable Farming", "interest": "Enough fresh water when their crops need it, above all as they germinate, to lower their farms' risk or to raise production. Many want to invest in measures that hold fresh water, once the technique, its costs, its risks and its gain in yield are known for the island's conditions; while supply from outside and measures on the island are both still debated, they hold back.", "influence": "Decide what the island's farmland grows and how each field is drained, irrigated and supplied with water: in 2025, 200 farms registered on the island grew arable crops on 9,094 ha, of the 13,752 ha of farmland of its 240 farms. A measure in the subsoil can serve several neighbouring farms, which collect and tap its water together; the study of the island's farms explored measures for clusters of one to three. As owners of farmland they decide whether the water board may charge them more for a water supply project: at least half must respond and two thirds of those be in favour. On a draft water level plan they can send views within six weeks and, if affected, appeal at the court for six weeks after the decision. Score 5: they decide the adaptation itself.", "affected": "Their farms depend wholly on rain and on the fresh groundwater under the dunes, the creek ridges and the thin rainwater lenses of the low polders: the island has no link to the main freshwater system, so in dry periods no water can be brought in and no ditches flushed, its shallow groundwater and ditches carry much salt, and the farms run short of water; drought in the growing season, subsidence and sea level rise make this worse, and the dry years 2018–2020 showed the farms vulnerable. Delphy's report on the island's freshwater demand (2023) finds farming on the island im . Aardappeloogst valt flink tegen door droogte: 'We missen 20 procent'. Omroep Zeeland. https://www.omroepzeeland.nl/nieuws/18862756/aardappeloogst-valt-flink-tegen-door-droogte-we-missen-20-procent", "Wiepkema, F. (2023, May 31). Zonder meer zoet water wordt agrarisch ondernemen op Schouwen Duiveland onmogelijk. Akkerwijzer. https://www.akkerwijzer.nl/artikel/750772-zonder-meer-zoet-water-wordt-agrarisch-ondernemen-op-schouwen-duiveland-onmogelijk/", "Waterschapswet (version in force from 1 January 2026). https://wetten.overheid.nl/BWBR0005108/2026-01-01", "Waterschap Scheldestromen. (2025). Nota Peilbesluiten 2025: Kaders voor het opstellen en uitvoeren van peilbesluiten. https://scheldestromen.nl/sites/default/files/2025-05/Nota%20Peilbesluiten%202025.pdf", "Delphy. (2023, May 20). DORSD: Droogte Oplossingen Regio Schouwen Duiveland. https://www.boerderij.nl/app/uploads/2023/06/Verslag-Zoetwaterbehoefte-Schouwen-Duiveland.pdf"]}, {"id": "waterschap-scheldestromen", "label": "Waterschap Scheldestromen", "type": "Water management", "level": "Local / Provincial / Regional", "sector": "Water management", "interest": "Safe dikes and dunes first; then an optimal use of the water system, its ditch levels matched to soil and land use, fresh water kept available where it can and fresh groundwater kept in stock, within costs society accepts. It has no task as a supplier of fresh water: measures beyond its regular water management are for the users of the fresh water to pay.", "influence": "Sets the island's ditch levels in its water level plans (peilbesluiten: Duiveland 2021, Schouwen 2022), for the waters the province designates, to be held as far as possible, matched as far as it can to soil type and land use such as farming, after a process with the people of the area; sets and enforces the rules for farms' groundwater extraction for irrigation in its waterschapsverordening, a notification within limits per hectare and per well, a permit beyond them. Its general board sets the levy that pays for its water management: for 2026 the owners of unbuilt land other than nature, farmland among them, carry 22.78% of the costs, at €115.53 a hectare, its base rate, with a higher one for paved public roads. It may charge the farmland a water supply project serves up to 100% more, once a stakeholder has asked for the project, at least half of the owners have responded and two thirds of those are in favour; it charges more for its supply projects on Tholen and Sint Philipsland (10 to 50%) and in the Reigersbergsche polder (35 to 45%). It can take project decisions and expropriate land for its water tasks only. Of the 30 seats on its general board, 26 are for residents, two for unbuilt land and two for nature; of the residents' seats BBB now holds 7, Partij voor Zeeland and the SGP 4 each, the CDA, the PvdA, Water Natuurlijk and the VVD 2 each, and the Algemene Waterschapspartij, the ChristenUnie and the Partij voor de Dieren 1 each; ZLTO fills both seats for unbuilt land, and one of them sits on the daily board, responsible for fresh water, salinisation and drought. Score 5: it decides binding rules for the island's farms.", "affected": "Salinisation and drought enter its tasks: with sea level rise, drought and subsidence, more of its area may come to face salinisation; drought strengthens the harm saline seepage does, which is hard to undo; and drought, warming and salinisation affect the ecology of its waters. Dry springs and summers showed farming's need for fresh water in those seasons: supplying it is no legal duty of the board, yet a clear need in society, which it answers within its core tasks, using its surface water system to counter drought and keep fresh water available, exploring its treatment plants' effluent as a source and the sustainable use of fresh groundwater. Its budget for fresh water is limited, the costs fall to whoever benefits, and its legal means to charge them are limited. To make the use of groundwater more sustainable it needs better monitoring, research and groundwater models, and better permits, supervision and enforcement, since extracting too much too fast draws up the salt water under the fresh water; where too little fresh water is available, drying can damage roads, nature and dikes.", "influence score": 5, "client": "no", "no relations": "", "decides in the CLD": ["Water board's plans to raise ditch levels", "Water board levy on farmland", "Pumping the water board allows"], "sources": ["Waterschap Scheldestromen. (2021c). Waterschapsbeheerprogramma 2022–2027: Zeeuwse waterkeringen, watersystemen, afvalwaterketen en wegen klaar voor de toekomst. https://scheldestromen.nl/sites/default/files/2023-09/Waterschapsbeheerprogramma%202022-2027.pdf", "Waterschap Scheldestromen. (2021d, July 12). Peilbesluit Duiveland ter inzage (Waterschapsblad 2021, nr. 8486). https://zoek.officielebekendmakingen.nl/wsb-2021-8486.pdf", "Waterschap Scheldestromen. (2022, January 3). Peilbesluit Schouwen ter inzage (Waterschapsblad 2022, nr. 10). https://zoek.officielebekendmakingen.nl/wsb-2022-10.pdf", "Waterschap Scheldestromen. (2026b, May 29). Besluit wijziging artikel 2.9 van de Waterschapsverordening waterschap Scheldestromen (Waterschapsblad 2026, nr. 13978). https://zoek.officielebekendmakingen.nl/wsb-2026-13978.html", "Waterschapswet (version in force from 1 January 2026). https://wetten.overheid.nl/BWBR0005108/2026-01-01", "Omgevingswet (version in force from 1 July 2026). https://wetten.overheid.nl/BWBR0037885/2026-07-01", "Waterschap Scheldestromen. (2026c). Kostentoedelingsverordening watersysteembeheer en wegenbeheer waterschap Scheldestromen 2026. https://lokaleregelgeving.overheid.nl/CVDR752664/2", "Waterschap Scheldestromen. (2026d). Verordening op de watersysteemheffing waterschap Scheldestromen 2026. https://lokaleregelgeving.overheid.nl/CVDR752667/2", "Reglement voor het Waterschap Scheldestromen (version in force from 19 December 2025). https://lokaleregelgeving.overheid.nl/CVDR63880/6", "Waterschap Scheldestromen. (n.d.-a). Algemene vergadering. Retrieved November 21, 2026, from https://scheldestromen.nl/bestuur/algemene-vergadering", "Waterschap Scheldestromen. (n.d.-b). Dagelijks bestuur. Retrieved November 21, 2026, from https://scheldestromen.nl/bestuur/dagelijks-bestuur"]}, {"id": "gemeente-schouwen-duiveland", "label": "Gemeente Schouwen-Duiveland", "type": "Government", "level": "Local / Provincial / Regional", "sector": "Government", "interest": "A vital and liveable countryside, with farming, one of the island's main economic pillars, made climate-proof against salinisation, subsidence and extreme weather, and a reliable water system; water basins on farmland fitted into the landscape.", "influence": "Its council sets the omgevingsplan, since 1 January 2024 the one plan for the use of all land and buildings on the island, farmland included, and may expropriate land for a use that plan allows, where that is necessary and urgent, and establish a right of first refusal on land given a non-agricultural function; its executive decides where a farm may build a water basin outside its building plot; it pays part of farms' advice, research and machines for fresh water and climate-proof farming, and leads the Living Lab Schouwen-Duiveland. Score 5: it decides binding plans for the island's farms.", "affected": "Salinisation, subsidence and extreme weather put pressure on farming, one of the island's main economic pillars, and with it on the vital and liveable countryside the municipality seeks to keep. It budgets €1.1 million for a new Living Lab programme (2025), so that the farm sector stays diverse and resilient; its subsidy for farms' advice, research and machines for fresh water opens on 1 October 2026. The water basins farms build against drought damage have a spatial impact on the landscape, so the municipality sets how a basin outside a building plot is fitted into it.", "influence score": 5, "client": "no", "no relations": "", "decides in the CLD": ["Expropriation of farmland", "Farmland planned for other uses"], "sources": ["Omgevingswet (version in force from 1 July 2026). https://wetten.overheid.nl/BWBR0037885/2026-07-01", "Gemeente Schouwen-Duiveland. (n.d.). Omgevingsplan. Retrieved November 6, 2026, from https://www.schouwen-duiveland.nl/bouwen-verbouwen-en-slopen/bestemmingsplan", "Gemeente Schouwen-Duiveland. (2024, September 5). Beleidsregels waterbassins bouwwerken zijnde buiten bouwvlak gemeente Schouwen-Duiveland 2024 (Gemeenteblad 2024, nr. 380475). https://zoek.officielebekendmakingen.nl/gmb-2024-380475.pdf", "Gemeente Schouwen-Duiveland. (n.d.). Subsidie Zoet Water en Klimaatbestendige Landbouw. Retrieved November 6, 2026, from https://www.schouwen-duiveland.nl/ondernemen/financiele-hulp-voor-ondernemers/subsidies/subsidie-zoet-water-en-klimaatbestendige-landbouw", "Living Lab Schouwen-Duiveland. (n.d.). Partners. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/over-living-lab/partners", "Living Lab Schouwen-Duiveland. (2025, November 5). Gemeente Schouwen-Duiveland investeert 1,1 miljoen in nieuw programma Living Lab. https://livinglabschouwen-duiveland.nl/nieuws/gemeente-schouwen-duiveland-investeert-11-miljoen-nieuw-programma-living-lab"]}, {"id": "provincie-zeeland", "label": "Provincie Zeeland", "type": "Government", "level": "Local / Provincial / Regional", "sector": "Government", "interest": "Keeping agriculture in the delta, for the fertile deltas' part in world food production, and strengthening nature; enough fresh water and good water quality, worked out with stakeholders in the Zeeuws Deltaplan Zoet Water; groundwater extraction in balance with its recharge.", "influence": "Sets regional water policy and the omgevingsverordening, whose rules reach the water board, the municipalities, residents and businesses, among them instruction rules the water board's water level plans and the municipality's omgevingsplan follow; sets the water board's tasks and rules of organisation and supervises it, its executive able to annul any of the board's decisions; designates in the omgevingsverordening the waters that need a water level plan; grants the permits for groundwater extraction above 150,000 m³ a year, for drinking water and for open soil energy systems. It may take project decisions and, for a provincial interest or where that is efficient, expropriate land, and for a provincial interest establish a right of first refusal on land given a non-agricultural function. In its omgevingsverordening it may rank the uses within the two lowest categories of the verdringingsreeks; no source read shows Zeeland doing so. It commissioned a study of a fresh water pipeline to the island (2021), after the farming sector pressed for one; the study leaves open who pays and who would run it, and no source read shows a decision on a route. Score 5: it decides binding rules for the island's farms, mostly through the water board's and the municipality's decisions.", "affected": "Zeeland has very little supply of fresh water of its own and salinisation as a specific concern; climate change raises the chance that demand for fresh water outruns supply, with negative consequences for agricultural yields and nature values, against its aim of keeping agriculture in the delta. Long drought causes water shortages, and sea level rise more (saline) seepage. Farms' groundwater extraction bears on its policy of balance between extraction and recharge: it researches registering extractions and extends the groundwater monitoring network to follow the small fresh groundwater stocks better.", "influence score": 5, "client": "no", "no relations": "", "decides in the CLD": ["Freshwater supply route to the island"], "sources": ["Provincie Zeeland. (2025). Regionaal Waterprogramma 2022–2027 (Provinciaal blad 2025, 3897). https://lokaleregelgeving.overheid.nl/CVDR736656", "Waterschapswet (version in force from 1 January 2026). https://wetten.overheid.nl/BWBR0005108/2026-01-01", "Omgevingswet (version in force from 1 July 2026). https://wetten.overheid.nl/BWBR0037885/2026-07-01", "Informatiepunt Leefomgeving. (n.d.). Verdringingsreeks: rangorde bij waterschaarste. Retrieved November 6, 2026, from https://iplo.nl/thema/water/beheer-watersysteem/verdringingsreeks/", "Witteveen+Bos. (2021). Zoetwateraanvoer Schouwen-Duiveland: Verkenning (12460/21-002.663). https://acpt.deltaexpertise.hz.nl/images/c/c5/Verkenning_externe_aanvoer_Schouwen-Duiveland.pdf"]}, {"id": "banks", "label": "Banks lending to the island's farmers", "type": "Financial institution", "level": "National", "sector": "Finance", "interest": "Loans a farm can repay from its cash flow, with its land and other assets as security; an investment whose returns are not yet proven they often count as a risk. In Rabobank's words, to be a partner of the entrepreneur and help farmers invest in sustainability.", "influence": "Supply 90% of the borrowed capital of Dutch farms (2018), Rabobank about 85% of the lending to the Dutch food and agri sector (2021); they decide whether a farm gets a loan and at what rate, judging more and more by its cash flow and the entrepreneur, as the Basel capital rules steer them towards profitability and liquidity, with land still an important security, and they count sustainability in classifying a borrower. Measured nationally: no source shows the banks' shares on the island. Score 4: they decide credit many of the island's farms depend on, without binding them.", "affected": "Of the Netherlands' arable regions, the south-western clay region faces the greatest task with drought in Rabobank's research (2023), above all because Zeeland is relatively vulnerable to salinisation: the average arable farm's income has held up in dry years, higher prices outweighing lower yields, but farms with little access to fresh water or with salinisation problems can come under pressure, and less fresh water could force a switch to far costlier m's costs of advice, research and machines for fresh water and climate-proof farming, from the Living Lab.", "sources": ["Gemeente Schouwen-Duiveland. (n.d.). Subsidie Zoet Water en Klimaatbestendige Landbouw. Retrieved November 6, 2026, from https://www.schouwen-duiveland.nl/ondernemen/financiele-hulp-voor-ondernemers/subsidies/subsidie-zoet-water-en-klimaatbestendige-landbouw"]}, {"from": "Gemeente Schouwen-Duiveland", "to": "Living Lab Schouwen-Duiveland", "kind": "works with", "description": "Leads the Living Lab Schouwen-Duiveland, a network with a light organisation, its project leader one of the municipality's staff.", "sources": ["Living Lab Schouwen-Duiveland. (n.d.). Partners. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/over-living-lab/partners"]}, {"from": "Provincie Zeeland", "to": "Waterschap Scheldestromen", "kind": "authority over", "description": "Sets the water board's area, tasks and rules of organisation by provincial regulation, sets rules in its omgevingsverordening for the water board's water level plans, and supervises it.", "sources": ["Waterschapswet (version in force from 1 January 2026). https://wetten.overheid.nl/BWBR0005108/2026-01-01", "Omgevingswet (version in force from 1 July 2026). https://wetten.overheid.nl/BWBR0037885/2026-07-01", "Provincie Zeeland. (2025). Regionaal Waterprogramma 2022–2027 (Provinciaal blad 2025, 3897). https://lokaleregelgeving.overheid.nl/CVDR736656", "Waterschap Scheldestromen. (2021c). Waterschapsbeheerprogramma 2022–2027: Zeeuwse waterkeringen, watersystemen, afvalwaterketen en wegen klaar voor de toekomst. https://scheldestromen.nl/sites/default/files/2023-09/Waterschapsbeheerprogramma%202022-2027.pdf"]}, {"from": "Provincie Zeeland", "to": "Gemeente Schouwen-Duiveland", "kind": "authority over", "description": "Sets instruction rules in its omgevingsverordening that the municipality's omgevingsplan follows, such as the rule on water basins on farmland.", "sources": ["Omgevingswet (version in force from 1 July 2026). https://wetten.overheid.nl/BWBR0037885/2026-07-01", "Gemeente Schouwen-Duiveland. (2024, September 5). Beleidsregels waterbassins bouwwerken zijnde buiten bouwvlak gemeente Schouwen-Duiveland 2024 (Gemeenteblad 2024, nr. 380475). https://zoek.officielebekendmakingen.nl/gmb-2024-380475.pdf"]}, {"from": "Provincie Zeeland", "to": "Gemeente Schouwen-Duiveland", "kind": "finances", "description": "Co-financed, beside an EU contribution, the project Samenwerken voor Zoet Water (2020–2022) of the Living Lab, which the municipality leads.", "sources": ["Living Lab Schouwen-Duiveland. (n.d.-a). Samenwerken voor Zoet Water. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/samenwerken-voor-zoet-water", "Living Lab Schouwen-Duiveland. (n.d.). Partners. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/over-living-lab/partners"]}, {"from": "Provincie Zeeland", "to": "Delta Climate Center", "kind": "finances", "description": "Provided, with the national government, the €88 million budget the Delta Climate Center was to start with in mid-2023; its founding is part of the national compensation package Wind in de Zeilen.", "sources": ["NIOZ. (2023, February 15). Green light for Delta Climate Center in Vlissingen. https://www.nioz.nl/en/news/green-light-for-delta-climate-center-in-vlissingen"]}, {"from": "Banks lending to the island's farmers", "to": "Arable farmers on Schouwen-Duiveland", "kind": "finances", "description": "Lend to farms: in the Netherlands, 90% of farms' borrowed capital comes from banks, almost 1 million euro of bank loans per arable farm on average in 2018.", "sources": ["van der Meulen, H., van der Meer, R., & van Asseldonk, M. (2020). Financiering transitie naar duurzame landbouw: Inzicht in het huidige financieringslandschap en ontwikkelingen (Rapport 2020-097). Wageningen Economic Research. https://edepot.wur.nl/532092"]}, {"from": "Buyers and processors of the island's crops", "to": "Arable farmers on Schouwen-Duiveland", "kind": "buys from", "description": "Cosun Beet Company buys the island's sugar beet, 1,336 ha on 110 farms in 2025, as it processes all beet grown in the Netherlands; it belongs to Royal Cosun, a cooperative of the beet growers, and sets how much beet its members may deliver; the potato processors buy most of their potatoes under contract or in a pool, measured nationally.", "sources": ["Minister van Klimaat en Groene Groei, & Staatssecretaris van Infrastructuur en Waterstaat. (2025, December 18). Brief over de ondertekening van de maatwerkafspraak met Royal Cosun (Kamerstukken II 2025/26, 29826, nr. 278). https://zoek.officielebekendmakingen.nl/kst-29826-278.html", "CBS. (2026, March 30). Landbouw; gewassen, dieren en grondgebruik naar gemeente (StatLine table 80781ned, final figures for 2025) [Data set]. https://opendata.cbs.nl/statline/#/CBS/nl/dataset/80781ned", "Cosun Beet Company. (2026, January 27). Beet campaign 2025 successfully completed. https://www.cosunbeetcompany.com/news/beet-campaign-2025-successfully-completed/485", "Cosun Beet Company. (n.d.). Royal Cosun. Retrieved November 6, 2026, from https://www.cosunbeetcompany.com/about-us/royal-cosun", "Janssens, B., van der Meer, R., & Smit, B. (2020). Gevolgen van de coronacrisis voor de aardappelsector. Wageningen Economic Research. https://edepot.wur.nl/523096"]}, {"from": "Buyers and processors of the island's crops", "to": "Arable farmers on Schouwen-Duiveland", "kind": "advises", "description": "Cosun Beet Company advises its beet growers field by field through its BAS app, from their crop records in Unitip, soil maps and satellite images, in line with the cultivation guide of the IRS, the Dutch sugar beet research centre it works with.", "sources": ["Cosun Beet Company. (n.d.). Sustainable beet production. Retrieved November 6, 2026, from https://www.cosunbeetcompany.com/sustainability/sustainable-beet-production"]}, {"from": "ZLTO", "to": "Arable farmers on Schouwen-Duiveland", "kind": "represents", "description": "Speaks for its members among the island's farmers, through its branch on the island, to the municipality, the water board and the province; its board appoints the water board's two members for unbuilt land, farmland included.", "sources": ["ZLTO. (n.d.). Afdelingen. Retrieved November 6, 2026, from https://www.zlto.nl/over-zlto/afdelingen/", "Reglement voor het Waterschap Scheldestromen (version in force from 19 December 2025). https://lokaleregelgeving.overheid.nl/CVDR63880/6", "van Essen, C. (2026, October 15). Aardappeloogst valt flink tegen door droogte: 'We missen 20 procent'. Omroep Zeeland. https://www.omroepzeeland.nl/nieuws/18862756/aardappeloogst-valt-flink-tegen-door-droogte-we-missen-20-procent"]}, {"from": "ZLTO", "to": "Waterschap Scheldestromen", "kind": "works with", "description": "Takes the initiative in the plan that carries out the Deltaplan Agrarisch Waterbeheer in Zeeland, the measures farmers take of their own accord for the water board's water quality and quantity tasks, working with the water board.", "sources": ["Provincie Zeeland. (2025). Regionaal Waterprogramma 2022–2027 (Provinciaal blad 2025, 3897). https://lokaleregelgeving.overheid.nl/CVDR736656"]}, {"from": "ZLTO", "to": "Provincie Zeeland", "kind": "works with", "description": "Takes the initiative in the plan that carries out the Deltaplan Agrarisch Waterbeheer in Zeeland, working with the province.", "sources": ["Provincie Zeeland. (2025). Regionaal Waterprogramma 2022–2027 (Provinciaal blad 2025, 3897). https://lokaleregelgeving.overheid.nl/CVDR736656"]}, {"from": "Consumers", "to": "Buyers and processors of the island's crops", "kind": "buys from", "description": "Buy the processors' frozen potato products, about 80% of them abroad, through catering and fast food; when these closed worldwide in 2020, the processors could take far fewer potatoes for the rest of the season. Measured nationally.", "sources": ["Janssens, B., van der Meer, R., & Smit, B. (2020). Gevolgen van de coronacrisis voor de aardappelsector. Wageningen Economic Research. https://edepot.wur.nl/523096"]}, {"from": "EU", "to": "LVVN", "kind": "authority over", "description": "Sets the Common Agricultural Policy within which the Netherlands draws up its national CAP Strategic Plan, from the toolbox of measures the Commission provides; the CAP is funded from the EU budget and its payments are managed nationally.", "sources": ["European Commission. (n.d.). CAP at a glance. Retrieved November 6, 2026, from https://agriculture.ec.europa.eu/common-agricultural-policy/cap-overview/cap-2023-27_en"]}, {"from": "EU", "to": "Arable farmers on Schouwen-Duiveland", "kind": "authority over", "description": "Ties its income support to conditionality: every farmer must respect the statutory management requirements, and a farmer receiving CAP support also the good agricultural and environmental conditions, or the support is reduced.", "sources": ["European Commission. (n.d.). Conditionality. Retrieved November 6, 2026, from https://agriculture.ec.europa.eu/common-agricultural-policy/income-support/conditionality_en"]}, {"from": "EU", "to": "Banks lending to the island's farmers", "kind": "authority over", "description": "Sets the banks' capital requirements in the Capital Requirements Regulation, whose final Basel III elements apply from 1 January 2025.", "sources": ["European Commission, Directorate-General for Financial Stability, Financial Services and Capital Markets Union. (2023, December 14). Latest updates on the banking package. https://finance.ec.europa.eu/news/latest-updates-banking-package-2023-12-14_en"]}, {"from": "LVVN", "to": "Arable farmers on Schouwen-Duiveland", "kind": "finances", "description": "Pays the farms that apply the CAP's income support and eco-scheme premium per hectare, at the tariffs its minister sets (for 2025: €174 basic income support, €50.35 more on the first 40 hectares, €60 to €200 for the eco-scheme), RVO paying them out on its behalf, as it does the 2026 eco-scheme premium; measured nationally.", "sources": ["Minister van Landbouw, Visserij, Voedselzekerheid en Natuur. (2026, March 7). Besluit vaststelling definitieve tarieven GLB 2025 (nr. WJZ/102571548). https://wetten.overheid.nl/BWBR0052414/2026-03-10", "RVO. (n.d.). Eco-regeling 2026. Retrieved November 6, 2026, from https://www.rvo.nl/subsidies-financiering/glb-2026/eco-regeling"]}, {"from": "IenW", "to": "Rijkswaterstaat", "kind": "authority over", "description": "Is responsible for managing the main water system, which Rijkswaterstaat carries out for it.", "sources": ["Algemene Rekenkamer. (2026, September 3). Zorgen over zoetwater: Onderzoek naar de voortgang van het Deltaprogramma Zoetwater. https://www.tweedekamer.nl/downloads/document?id=2026D40892"]}, {"from": "IenW", "to": "Waterschap Scheldestromen", "kind": "authority over", "description": "Ranks the uses of water in a shortage by the verdringingsreeks of its freshwater policy, which every water manager, the water board among them, follows; may instruct water boards on regional water management where international obligations or interests beyond a region require it.", "sources": ["Algemene Rekenkamer. (2026, September 3). Zorgen over zoetwater: Onderzoek naar de voortgang van het Deltaprogramma Zoetwater. https://www.tweedekamer.nl/downloads/document?id=2026D40892", "Informatiepunt Leefomgeving. (n.d.). Verdringingsreeks: rangorde bij waterschaarste. Retrieved November 6, 2026, from https://iplo.nl/thema/water/beheer-watersysteem/verdringingsreeks/"]}, {"from": "IenW", "to": "Provincie Zeeland", "kind": "authority over", "description": "May instruct provinces on regional water management where international obligations or interests beyond a region require it; under the verdringingsreeks a province may rank the uses within its last two categories in its omgevingsverordening, never between them.", "sources": ["Algemene Rekenkamer. (2026, September 3). Zorgen over zoetwater: Onderzoek naar de voortgang van het Deltaprogramma Zoetwater. https://www.tweedekamer.nl/downloads/document?id=2026D40892", "Informatiepunt Leefomgeving. (n.d.). Verdringingsreeks: rangorde bij waterschaarste. Retrieved November 6, 2026, from https://iplo.nl/thema/water/beheer-watersysteem/verdringingsreeks/"]}, {"from": "IenW", "to": "LVVN", "kind": "works with", "description": "Its minister coordinates the Delta Programme for Fresh Water, whose Bestuurlijk Platform Zoetwater seats LVVN's directors beside IenW's, Rijkswaterstaat's and the freshwater regions'; the two ministries publish the Delta Programme with VRO.", "sources": ["Algemene Rekenkamer. (2026, September 3). Zorgen over zoetwater: Onderzoek naar de voortgang van het Deltaprogramma Zoetwater. https://www.tweedekamer.nl/downloads/document?id=2026D40892", "Ministerie van Infrastructuur en Waterstaat, Ministerie van Landbouw, Visserij, Voedselzekerheid en Natuur, & Ministerie van Volkshuisvesting en Ruimtelijke Ordening. (2026). Nationaal Deltaprogramma 2027: Van maakbaar naar weerbaar. https://www.tweedekamer.nl/downloads/document?id=2026D43642"]}, {"from": "Rijkswaterstaat", "to": "Waterschap Scheldestromen", "kind": "works with", "description": "Agreed with Waterschap Scheldestromen, Brabantse Delta and Hollandse Delta a renewed Waterakkoord Volkerak-Zoommeer (2026, for 15 years) on the lake's water management in normal, wet and dry conditions, so that enough fresh water stays available for nature and agriculture.", "sources": ["Rijkswaterstaat. (2026, May 11). Nieuw waterakkoord Volkerak-Zoommeer. https://www.rijkswaterstaat.nl/nieuws/archief/2026/05/nieuw-waterakkoord-volkerak-zoommeer"]}, {"from": "Deltares", "to": "Arable farmers on Schouwen-Duiveland", "kind": "advises", "description": "With KWR and Acacia Water, in the Living Lab's project Samenwerken voor Zoet Water (2020–2022), made quickscans for 13 of the island's farmers, from kitchen-table talks with them, each ending in advice on storing fresh water that fits the farm's soil, groundwater and economics; no source says which partner wrote which advice.", "sources": ["Kaandorp, V. P., Davids, T., de Louw, P. G. B., Roelandse, A., Noordegraaf, I., Krajenbrink, H. J., Schout, G., Raat, K. J., & van Veelen, P. C. (2022). Samenwerken voor zoet water Schouwen-Duiveland – van pilots naar grootschalige toepassing: Eindrapport (11205909-000-BGS-0003). Deltares. https://livinglabschouwen-duiveland.nl/sites/default/files/2022-07/112059~1.PDF", "Living Lab Schouwen-Duiveland. (n.d.-a). Samenwerken voor Zoet Water. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/samenwerken-voor-zoet-water"]}, {"from": "KWR", "to": "Arable farmers on Schouwen-Duiveland", "kind": "advises", "description": "With Deltares and Acacia Water, in the Living Lab's project Samenwerken voor Zoet Water (2020–2022), made quickscans for 13 of the island's farmers, from kitchen-table talks with them, each ending in advice on storing fresh water that fits the farm's soil, groundwater and economics; no source says which partner wrote which advice.", "sources": ["Kaandorp, V. P., Davids, T., de Louw, P. G. B., Roelandse, A., Noordegraaf, I., Krajenbrink, H. J., Schout, G., Raat, K. J., & van Veelen, P. C. (2022). Samenwerken voor zoet water Schouwen-Duiveland – van pilots naar grootschalige toepassing: Eindrapport (11205909-000-BGS-0003). Deltares. https://livinglabschouwen-duiveland.nl/sites/default/files/2022-07/112059~1.PDF", "Living Lab Schouwen-Duiveland. (n.d.-a). Samenwerken voor Zoet Water. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/samenwerken-voor-zoet-water"]}, {"from": "Acacia Water", "to": "Arable farmers on Schouwen-Duiveland", "kind": "works with", "description": "Its hydrologists led the farmers taking part in Natuurlijk Zoet (2019–2021) in measuring the salinity of the ditches round their fields, the results in the water board's database.", "sources": ["Living Lab Schouwen-Duiveland. (n.d.). Natuurlijk Zoet. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/natuurlijk-zoet"]}, {"from": "Acacia Water", "to": "Arable farmers on Schouwen-Duiveland", "kind": "advises", "description": "With Deltares and KWR, in the Living Lab's project Samenwerken voor Zoet Water (2020–2022), made quickscans for 13 of the island's farmers, from kitchen-table talks with them, each ending in advice on storing fresh water that fits the farm's soil, groundwater and economics; no source says which partner wrote which advice.", "sources": ["Kaandorp, V. P., Davids, T., de Louw, P. G. B., Roelandse, A., Noordegraaf, I., Krajenbrink, H. J., Schout, G., Raat, K. J., & van Veelen, P. C. (2022). Samenwerken voor zoet water Schouwen-Duiveland – van pilots naar grootschalige toepassing: Eindrapport (11205909-000-BGS-0003). Deltares. https://livinglabschouwen-duiveland.nl/sites/default/files/2022-07/112059~1.PDF", "Living Lab Schouwen-Duiveland. (n.d.-a). Samenwerken voor Zoet Water. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/samenwerken-voor-zoet-water"]}, {"from": "Delphy", "to": "Agrarisch Schouwen-Duiveland", "kind": "advises", "description": "Carried out the study of the island's freshwater demand (2023) for ZLTO's island branch, Agrarisch Schouwen-Duiveland, which commissioned and paid for it: farming on the island becomes impossible without more fresh water, so a supply of fresh water stays needed and more rain must be stored; the branch draws from it that a supply of fresh water is unavoidable.", "sources": ["Delphy. (2023, May 20). DORSD: Droogte Oplossingen Regio Schouwen Duiveland. https://www.boerderij.nl/app/uploads/2023/06/Verslag-Zoetwaterbehoefte-Schouwen-Duiveland.pdf", "Wiepkema, F. (2023, May 31). Zonder meer zoet water wordt agrarisch ondernemen op Schouwen Duiveland onmogelijk. Akkerwijzer. https://www.akkerwijzer.nl/artikel/750772-zonder-meer-zoet-water-wordt-agrarisch-ondernemen-op-schouwen-duiveland-onmogelijk/"]}, {"from": "Living Lab Schouwen-Duiveland", "to": "Waterschap Scheldestromen", "kind": "works with", "description": "The water board is one of its initiators and core partners.", "sources": ["Living Lab Schouwen-Duiveland. (n.d.). Partners. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/over-living-lab/partners"]}, {"from": "Living Lab Schouwen-Duiveland", "to": "Provincie Zeeland", "kind": "works with", "description": "The province is one of its initiators and core partners.", "sources": ["Living Lab Schouwen-Duiveland. (n.d.). Partners. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/over-living-lab/partners"]}, {"from": "Living Lab Schouwen-Duiveland", "to": "Agrarisch Schouwen-Duiveland", "kind": "works with", "description": "Agrarisch Schouwen-Duiveland, ZLTO's island branch, is one of its initiators and core partners, and carried out its project Samenwerken voor Zoet Water (2020–2022) with Deltares, KWR, Acacia Water and the municipality.", "sources": ["Living Lab Schouwen-Duiveland. (n.d.). Partners. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/over-living-lab/partners", "Living Lab Schouwen-Duiveland. (n.d.-a). Samenwerken voor Zoet Water. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/samenwerken-voor-zoet-water"]}, {"from": "Living Lab Schouwen-Duiveland", "to": "Deltares", "kind": "works with", "description": "Its project Samenwerken voor Zoet Water (2020–2022), on storing fresh water, was carried out with Deltares; Deltares also demonstrated and monitored new drainage on three of the island's farms in its later project (2022–2024).", "sources": ["Living Lab Schouwen-Duiveland. (n.d.-a). Samenwerken voor Zoet Water. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/samenwerken-voor-zoet-water", "Living Lab Schouwen-Duiveland. (n.d.-b). Samenwerken voor Zoetwater: Innovatieve drainage demonstreren, monitoren en evalueren. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/samenwerken-voor-zoetwater-innovatieve-drainage-demonstreren-monitoren-en-evalueren"]}, {"from": "Living Lab Schouwen-Duiveland", "to": "KWR", "kind": "works with", "description": "Its project Samenwerken voor Zoet Water (2020–2022), on storing fresh water, was carried out with KWR.", "sources": ["Living Lab Schouwen-Duiveland. (n.d.-a). Samenwerken voor Zoet Water. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/samenwerken-voor-zoet-water"]}, {"from": "Living Lab Schouwen-Duiveland", "to": "Acacia Water", "kind": "works with", "description": "Its project Samenwerken voor Zoet Water (2020–2022), on storing fresh water, was carried out with Acacia Water; Acacia Water also demonstrated and monitored new drainage on three of the island's farms in its later project (2022–2024).", "sources": ["Living Lab Schouwen-Duiveland. (n.d.-a). Samenwerken voor Zoet Water. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/samenwerken-voor-zoet-water", "Living Lab Schouwen-Duiveland. (n.d.-b). Samenwerken voor Zoetwater: Innovatieve drainage demonstreren, monitoren en evalueren. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/samenwerken-voor-zoetwater-innovatieve-drainage-demonstreren-monitoren-en-evalueren"]}, {"from": "Living Lab Schouwen-Duiveland", "to": "Delphy", "kind": "works with", "description": "Delphy is among its partners, and demonstrated and monitored new drainage on three of the island's farms in its project of 2022–2024.", "sources": ["Living Lab Schouwen-Duiveland. (n.d.). Partners. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/over-living-lab/partners", "Living Lab Schouwen-Duiveland. (n.d.-b). Samenwerken voor Zoetwater: Innovatieve drainage demonstreren, monitoren en evalueren. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/samenwerken-voor-zoetwater-innovatieve-drainage-demonstreren-monitoren-en-evalueren"]}, {"from": "Living Lab Schouwen-Duiveland", "to": "Trial farm Rusthoeve", "kind": "works with", "description": "Its project of 2022–2024 demonstrated and monitored new drainage on three of the island's farms with the trial farm Rusthoeve, among Acacia Water, Deltares, Delphy and the municipality.", "sources": ["Living Lab Schouwen-Duiveland. (n.d.-b). Samenwerken voor Zoetwater: Innovatieve drainage demonstreren, monitoren en evalueren. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/samenwerken-voor-zoetwater-innovatieve-drainage-demonstreren-monitoren-en-evalueren", "Living Lab Schouwen-Duiveland. (n.d.). Partners. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/over-living-lab/partners"]}, {"from": "Living Lab Schouwen-Duiveland", "to": "Arable farmers on Schouwen-Duiveland", "kind": "works with", "description": "Its project of 2022–2024 laid double drainage on two test plots at Kerkwerve and anti-salinisation drainage on one at Dreischor, on three of the island's farms, each with a board about the project on site.", "sources": ["Living Lab Schouwen-Duiveland. (2023, May 9). Anti-verziltingsdrainage in Dreischor. Retrieved November 8, 2026, from https://livinglabschouwen-duiveland.nl/nieuws/anti-verziltingsdrainage-dreischor", "Living Lab Schouwen-Duiveland. (n.d.-b). Samenwerken voor Zoetwater: Innovatieve drainage demonstreren, monitoren en evalueren. Retrieved November 6, 2026, from https://livinglabschouwen-duiveland.nl/projecten/samenwerken-voor-zoetwater-innovatieve-drainage-demonstreren-monitoren-en-evalueren"]}, {"from": "Agrarisch Schouwen-Duiveland", "to": "Arable farmers on Schouwen-Duiveland", "kind": "represents", "description": "Speaks for its members among the island's farmers to the municipality and the province, looking with them for more fresh water, and asks for a supply route to the island.", "sources": ["ZLTO. (n.d.). Afdelingen. Retrieved November 6, 2026, from https://www.zlto.nl/over-zlto/afdelingen/", "van Essen, C. (2026, October 15). Aardappeloogst valt flink tegen door droogte: 'We missen 20 procent'. Omroep Zeeland. https://www.omroepzeeland.nl/nieuws/18862756/aardappeloogst-valt-flink-tegen-door-droogte-we-missen-20-procent", "Omroep Zeeland. (2023, May 31). Sombere toekomst voor boeren op Schouwen-Duiveland door tekort aan zoet water. https://www.omroepzeeland.nl/nieuws/15614167/sombere-toekomst-voor-boeren-op-schouwen-duiveland-door-tekort-aan-zoet-water"]}], "version": "defd8cd"}</script>
