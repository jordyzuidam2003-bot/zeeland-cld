<script type="application/json" id="data">{"model": {"purpose": "Draft, for the team to check. What keeps arable farmers on Schouwen-Duiveland growing salt-sensitive crops and draining their land deeply, even as the soil and water get saltier and fresh water gets scarcer towards 2050? And which feedback loops keep them there, blocking the alternatives: storing fresh water, growing salt-tolerant crops, and wisselpolders? These three are the adaptive practices in the model because each works on a different part of the chain (the water supply, the crop's sensitivity, the land's height) and each is held back by something in the system; a practice that farmers raise in the group model building session and that fits neither of the three is a candidate to add. The CLD is the picture of the system the whole group works from in the next steps, the semi-quantitative analysis (SIP) and the multi-criteria analysis of LVVN's policy levers. It is not built around one outcome or one set of levers: the group picks those when that step starts.", "spatial scale": "Draft, for the team to check. The island of Schouwen-Duiveland: its farmland polders, the rainwater lenses under them, the soils, the farms and the land market, and how the water board manages water levels. The island gets no fresh water from elsewhere, so all its fresh water is winter rain stored in the lenses. What is decided at provincial and national level (the water board's funding, LVVN, the Deltaprogramma Zoetwater) comes from outside the boundary: it enters as a policy input, and the CLD shows how it reaches the island.", "time horizon": "Draft, for the team to check. 2050, the year the KNMI'23 climate scenarios and the project look ahead to. The slow parts of the system are judged against that date: the freshwater lens and land subsidence react within years, but raising land with a wisselpolder takes 50 to 100 years, so the decision to start one falls before 2050 while most of its effect comes after.", "system boundary": "Draft, for the team to check. Inside the model (endogenous, explained by its loops): the water and salt system (recharge, lens thickness, seepage, upconing, salt in the root zone, soil structure), crop yield and farm finances (revenue, land value, debt, credit, room to invest), whether farmers adopt the adaptive practices, and the objections to re-wetting land and to wisselpolders. Outside the model (exogenous: they drive it, the model does not explain them): the climate (hotter, drier summers, wetter winters, sea-level rise), EU banking rules (Basel IV), market demand for alternative crops, fresh water supplied from outside and national water policy, and LVVN's levers. Farmland leaving arable use (a buy-out, stopping, another land use) is in the model as one variable, because the land market and succession drive it and water management follows it; what the land becomes afterwards is not. Left out: nature and energy, world prices of conventional crops, and other land uses (livestock, vertical farming), which replace arable farming rather than adapt it. We assume the adaptive practices work rather than model whether they do: the CLD shows what stops farmers adopting them, not whether each one works on the island."}, "elements": [{"id": "hotter-drier-summers", "label": "Hotter, drier summers", "element type": "Constant", "adaptive practice": "no", "sets domain": "Ecological", "subquestion": "SQ1", "description": "Meteorological drought (KNMI'23): higher evaporation, summer precipitation deficit, and lower river discharge.", "sources": "", "sourced": "no"}, {"id": "sea-level-rise", "label": "Sea-level rise", "element type": "Constant", "adaptive practice": "no", "sets domain": "Ecological", "subquestion": "SQ1", "description": "Rising sea level (KNMI'23 scenarios); increases hydrostatic pressure of marine water on polders and estuaries.", "sources": "", "sourced": "no"}, {"id": "wetter-winters", "label": "Wetter winters", "element type": "Constant", "adaptive practice": "no", "sets domain": "Ecological", "subquestion": "SQ1", "description": "Increased winter precipitation, providing potential recharge volume if retained.", "sources": "", "sourced": "no"}, {"id": "clay-dispersion-sodification", "label": "Clay dispersion & sodification", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subquestion": "SQ1", "description": "Structural degradation of marine clay soils as sodium (Na+) replaces calcium (Ca2+) on clay complexes.", "sources": "", "sourced": "no"}, {"id": "crop-water-demand", "label": "Crop water demand", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subquestion": "SQ1", "description": "Evapotranspiration and crop water requirement, peaking during hot, dry summers.", "sources": "", "sourced": "no"}, {"id": "estuary-salt-intrusion", "label": "Estuary salt intrusion", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subquestion": "SQ1", "description": "Marine water penetrating further inland into estuaries and surface canals when sea levels rise and river discharge drops.", "sources": "", "sourced": "no"}, {"id": "freshwater-lens-recharge", "label": "Freshwater lens recharge", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subquestion": "SQ1", "description": "Infiltration of winter rainwater that refills the shallow rainwater lens.", "sources": "", "sourced": "no"}, {"id": "freshwater-lens-thickness", "label": "Freshwater lens thickness", "element type": "Stock", "adaptive practice": "no", "sets domain": "Ecological", "subquestion": "SQ1", "description": "Volume/thickness of the fresh rainwater lens floating on saline groundwater (1–2 m in low clay polders; 5–40 m in creek ridges).", "sources": "", "sourced": "no"}, {"id": "land-subsidence", "label": "Land subsidence", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subquestion":
