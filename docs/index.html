ong, 2004), against 16–32 mm on young marshes along the Westerschelde (De Mesel et al., 2013).", "sources": "De Mesel, I., Ysebaert, T., & Kamermans, P. (2013). Klimaatbestendige dijken: Het concept wisselpolders (Rapport C072/13). IMARES Wageningen UR. https://www.vliz.be/imisdocs/publications/289823.pdf\nMa, Z., Ysebaert, T., van der Wal, D., de Jong, D. J., Li, X., & Herman, P. M. J. (2014). Long-term salt marsh vertical accretion in a tidal bay with reduced sediment supply. Estuarine, Coastal and Shelf Science, 146, 14–23. https://doi.org/10.1016/j.ecss.2014.05.001\nvan Maldegem, D., & de Jong, D. (2004). Opwassen of verdrinken: Sedimentaanvoer naar schorren in de Oosterschelde, een zandhongerig gedempt getijdesysteem (Werkdocument RIKZ/AB/2003/826x). Rijkswaterstaat, Rijksinstituut voor Kust en Zee. https://edepot.wur.nl/174582", "sourced": "yes"}, {"id": "root-zone-salinity", "label": "Root zone salinity", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subsystem": "Water governance", "subquestion": "SQ1", "description": "Salt and chloride (Cl-) concentration in the crop root zone, causing osmotic stress and ion toxicity.", "sources": "", "sourced": "no"}, {"id": "saline-seepage-kwel", "label": "Saline seepage (kwel)", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subsystem": "Water governance", "subquestion": "SQ1", "description": "Upward hydrostatic pressure pushing salty groundwater through clay/peat layers (diffuse or via boils).", "sources": "", "sourced": "no"}, {"id": "soil-structure-usability", "label": "Soil structure & usability", "element type": "Stock", "adaptive practice": "no", "sets domain": "Ecological", "subsystem": "Water governance", "subquestion": "SQ1", "description": "Porosity, aeration, infiltration capacity, and workability of the agricultural soil.", "sources": "", "sourced": "no"}, {"id": "upconing-of-salt-groundwater", "label": "Upconing of salt groundwater nological", "subsystem": "Water governance", "subquestion": "SQ2", "description": "On-farm and sub-surface water retention: Freshmaker, ASR-Coastal, creek-ridge infiltration, and adjustable/smart drainage.", "sources": "", "sourced": "no"}, {"id": "groundwater-extraction-for-irrigation", "label": "Groundwater extraction for irrigation", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Water governance", "subquestion": "SQ2", "description": "Pumping of freshwater from creek ridges and lenses by farmers during summer droughts.", "sources": "", "sourced": "no"}, {"id": "policy-resistance-legal-delays", "label": "Objections to land-use plans", "element type": "Stock", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Finance and land", "subquestion": "SQ2", "description": "Opposition to plans for re-wetting land through political and legal channels: objections, appeals at the Council of State (Raad van State) and political pressure, which slow or stop a plan.", "sources": "", "sourced": "no"}, {"id": "winter-rain-drained-away", "label": "Winter rain drained away", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Water governance", "subquestion": "SQ1", "description": "Winter precipitation rapidly discharged to sea via field drains and pumping stations instead of recharging the lens.", "sources": "", "sourced": "no"}, {"id": "crop-yield", "label": "Crop yield", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subsystem": "Water governance", "subquestion": "SQ1", "description": "Physical yield per hectare of conventional crops (potatoes, onions, sugar beet) under the prevailing salinity, freshwater and soil conditions.", "sources": "", "sourced": "no"}, {"id": "market-demand-for-alternative-crops", "label": "Market demand for alternative crops", "element type": "Constant", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Finance and land", "subquestion": "SQ2", "description": "Consumer demand and offtake contracts for novel salt-tolerant or alternative crops (e.g. protein crops).", "sources": "", "sourced": "no"}, {"id": "processing-capacity-for-alternative-crops", "label": "Processing capacity for alternative crops", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Finance and land", "subquestion": "SQ2", "description": "Processing plants, breeding investment and supply chain infrastructure for novel salt-tolerant or alternative crops.", "sources": "", "sourced": "no"}, {"id": "salt-tolerant-crop-adoption", "label": "Salt-tolerant crop adoption", "element type": "Auxiliary", "adaptive practice": "yes", "sets domain": "Technological", "subsystem": "Finance and land", "subquestion": "SQ2", "description": "Cultivation of salt-tolerant varieties (potato/onion breeds) and halophytes/novel crops (quinoa, samphire, sea aster, field beans).", "sources": "", "sourced": "no"}, {"id": "agricultural-land-value", "label": "Agricultural land value", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Finance and land", "subquestion": "SQ2", "description": "Market value of conventional farmland (€/ha), serving as the primary collateral for bank loans.", "sources": "", "sourced": "no"}, {"id": "bank-credit-freeze-risk-premiums", "label": "Bank credit freeze & risk premiums", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Finance and land", "subquestion": "SQ2", "description": "Higher interest rates and tighter lending by agricultural banks when land collateral values drop or climate risks rise.", "sources": "", "sourced": "no"}, {"id": "basel-iv-capital-requirements", "label": "Basel IV capital requirements", "element type": "Constant", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Finance and land", "subquestion" relative to the value of its assets, the inverse of its solvency (equity as a share of total capital). Land is 70% of an arable farm's balance sheet, so the ratio moves with the land price: arable farms' solvency was 81% in 2018 because their land had risen in value, while their long-term debt had tripled since 2001 to 770,000 euro per farm (van der Meulen et al., 2020).", "sources": "van der Meulen, H., van der Meer, R., & van Asseldonk, M. (2020). Financiering transitie naar duurzame landbouw: Inzicht in het huidige financieringslandschap en ontwikkelingen (Rapport 2020-097). Wageningen Economic Research. https://edepot.wur.nl/532092", "sourced": "yes"}, {"id": "farmland-leaving-arable-use", "label": "Farmland leaving arable use", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Finance and land", "subquestion": "SQ3", "description": "Arable land on the island that stops being farmed as arable land: taken out of production or put to another use, whoever owns it. A sale counts only when the land leaves arable farming: land that another arable farmer takes over stays arable, and land that switches to salt-tolerant crops is Salt-tolerant crop adoption. What the land becomes afterwards (nature, grassland, water storage) is outside the model.", "sources": "", "sourced": "no"}], "connections": [{"id": "hotter-drier-summers--crop-water-demand", "from": "hotter-drier-summers", "to": "crop-water-demand", "direction": "directed", "label": "+", "type": "+", "polarity": "positive", "delay": "no", "description": "Higher temperatures increase evapotranspiration and crop water requirements.", "sets link": "Within E", "sets scope": "Within domain", "sources": "", "sourced": "no"}, {"id": "hotter-drier-summers--estuary-salt-intrusion", "from": "hotter-drier-summers", "to": "estuary-salt-intrusion", "direction": "directed", "label": "+", "type": "+", "polarity": "positive", "delay": "no", "description": "Low summer river discharge allows seawater to penetrate further inland.", "sets link": "Within E", "sets scope": "Within domain", "sources": "", "sourced": "no"}, {"id": "hotter-drier-summers--freshwater-lens-recharge", "from": "hotter-drier-summers", "to": "freshwater-lens-recharge", "direction": "directed", "label": "−", "type": "-", "polarity": "negative", "delay": "no", "description": "Summer precipitation deficit and high evaporation reduce natural recharge.", "sets link": "Within E", "sets scope": "Within domain", "sources": "", "sourced": "no"}, {"id": "sea-level-rise--estuary-salt-intrusion", "from": "sea-level-rise", "to": "estuary-salt-intrusion", "direction": "directed", "label": "+", "type": "+", "polarity": "positive", "delay": "no", "description": "Rising sea level pushes marine water further into estuaries.", "sets link": "Within E", "sets scope": "Within domain", "sources": "", "sourced": "no"}, {"id": "sea-level-rise--saline-seepage-kwel", "from": "sea-level-rise", "to": "saline-seepage-kwel", "direction": "directed", "label": "+", "type": "+", "polarity": "positive", "delay": "no", "description": "Higher sea level increases hydrostatic pressure beneath dikes.", "sets link": "Within E", "sets scope": "Within domain", "sources": "", "sourced": "no"}, {"id": "wetter-winters--freshwater-lens-recharge", "from": "wetter-winters", "to": "freshwater-lens-recharge", "direction": "directed", "label": "+", "type": "+", "polarity": "positive", "delay": "no", "description": "More winter precipitation increases potential infiltration into the soil.", "sets link": "Within E", "sets scope": "Within domain", "sources": "", "sourced": "no"}, {"id": "wetter-winters--winter-rain-drained-away", "from": "wetter-winters", "to": "winter-rain-drained-away", "direction": "directed", "label": "+", "type": "+", "polarity": "positive", "delay": "no", "description": "Higher winter rainfall peaks are mostly discharged under conventional drainage.", "sets link": "E to T", "sets scope": "Cross-domain", "sources": "", "sourced": "no"}, {"id": "clay-dispersion-sodification--soil-structure-usability", "from": "clay-dispersion-sodification", "to": "soil-structure-usability", "direction": "directed", "label": "−", "type": "-", "polarity": "negative", "delay": "no", "description": "Sodification destroys soil aggregates, porosity, aeration, and workability.", "sets link": "Within E", "sets scope": "Within domain", "sources": "", "sourced": "no"}, {"id": "crop-water-demand--groundwater-extraction-for-irrigation", "from": "crop-water-demand", "to": "groundwater-extraction-for-irrigation", "direction": "directed", "label": "+", "type": "+", "polarity": "positive", "delay": "no", "description": "Higher crop water need drives farmers to pump more groundwater.", "sets link": "E to T", "sets scope": "Cross-domain", "sources": "", "sourced": "no"}, {"id": "estuary-salt-intrusion--brackish-irrigation-water-use", "from": "estuary-salt-intrusion", "to": "brackish-irrigation-water-use", "direction": "directed", "label": "+", "type": "+", "polarity": "positive", "delay": "no", "description": "Salinisation of surface canals makes intake water for irrigation brackish.", "sets link": "E to T", "sets scope": "Cross-domain", "sources": "", "sourced": "no"}, {"id": "freshwater-lens-recharge--freshwater-lens-thickness", "from": "freshwater-lens-recharge", "to": "freshwater-lens-thickness", "direction": "directed", "label": "+", "type": "+", "polarity": "positive", "delay": "yes", "description": "Rainwater infiltration builds up the floating freshwater lens, but slowly: the lens is a stock that a year's recharge barely moves. In the thin polder lenses of Schouwen-Duiveland the mixing zone shifts at most 0.1 m within a year, with vertical flow of at most 1.2 mm per day (de Louw et al., 2011). Under a creek ridge, raising the winter water table 0.5 m thickened a 13–15 m lens by 6–8 m in ten years, and the lens had not reached its new thickness yet (Pauw et al., 2015, a model result for Walcheren). So a change in recharge takes years to a decade to show in the lens.", "sets link": "Within E", "sets scope": "Within domain", "sources": "de Louw, P. G. B., Eeman, S., Siemon, B., Voortman, B. R., Gunnink, J., van Baaren, E. S., & Oude Essink, G. H. P. (2011). Shallow rainwater lenses in deltaic areas with saline seepage. Hydrology and Earth System Sciences, 15(12), 3659–3678. https://doi.org/10.5194/hess-15-3659-2011\nPauw, P. S., van Baaren, E. S., Visser, M., de Louw, P. G. B., & Oude Essink, G. H. P. (2015). Increasing a freshwater lens below a creek ridge using a controlled artificial recharge and drainage system: A case study in the Netherlands. Hydrogeology Journal, 23(7), 1415–1430. https://doi.org/10.1007/s10040-015-1264-z", "sourced": "yes"}, {"id": "freshwater-lens-thickness--root-zone-salinity", "from": "freshwater-lens-thickness", "to": "root-zone-salinity", "direction": "directed", "label": "−", "type": "-", "polarity": "negative", "delay": "no", "description": "A thick freshwater lens keeps saline groundwater safely below the root zone.", "sets link": "Within E", "sets scope": "Within domain", "sources": "", "sourced": "no"}, {"id": "freshwater-lens-thickness--upconing-of-salt-groundwater", "from": "freshwater-lens-thickness", "to": "upconing-of-salt-groundwater", "direction": "directed", "label": "−", "type": "-", "polarity": "negative", "delay": "no", "description": "A thicker freshwater lens buffers against salt upconing under wells.", "sets link": "Within E", "sets scope": "Within domain", "sources": "", "sourced": "no"}, {"id": "freshwater-lens-thickness--freshwater-availability-for-crops", "from": "freshwater-lens-thickness", "to": "freshwater-availability-for-crops", "direction": "directed", "label": "+", "type": "+", "polarity": "positive", "delay": "no", "description": "A thicker lens provides a larger buffer of fresh soil moisture in summer.", "sets link": "Within E", "sets scope": "Within domain", "sources": "", "sourced": "no"}, {"id": "land-
