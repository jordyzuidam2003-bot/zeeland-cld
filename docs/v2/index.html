r infiltrates and how well roots grow. Workability, which structure and wetness both shape, is Spring workability of the fields.", "sources": "", "sourced": "no"}, {"id": "upconing-of-salt-groundwater", "label": "Upconing of salt groundwater", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subsystem": "Water and soil", "subquestion": "SQ1", "description": "Upward cone of the salt-freshwater interface beneath pumping irrigation wells as the freshwater lens thins.", "sources": "", "sourced": "no"}, {"id": "brackish-irrigation-water-use", "label": "Brackish irrigation water use", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Water and soil", "subquestion": "SQ2", "description": "Irrigation with salinised surface or well water, when fresh water falls short.", "actor": "Arable farmers on Schouwen-Duiveland", "sources": "", "sourced": "no"}, {"id": "demand-for-deep-polder-drainage", "label": "Farmers' demand for deep polder drainage", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Water and soil", "subquestion": "SQ2", "description": "Farmers' wish for low ditch levels in spring, so heavy machinery can work the fields early, which they put to the water board as it makes its water level plans.", "actor": "Arable farmers on Schouwen-Duiveland", "sources": "", "sourced": "no"}, {"id": "external-freshwater-supply", "label": "Fresh water supplied to the island", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Water and soil", "subquestion": "SQ1", "description": "Fresh water brought to the island's farms from outside it in the growing season (present in Tholen and Zeeuws-Vlaanderen; absent on Walcheren, the Bevelanden and Schouwen-Duiveland). It needs a supply route, and in drought it is what the national distribution leaves for the route to carry.", "sources": "", "sourced": "no"}, {"id": "freshwater-availability-for-crops", "label": "Freshwater availability for crops", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subsystem": "Water and soil", "subquestion": "SQ1", "description": "Fresh water crops can draw on in the growing season: soil moisture over the lens, and what farmers pump or have supplied.", "sources": "", "sourced": "no"}, {"id": "freshwater-storage-measures", "label": "Freshwater storage measures", "element type": "Auxiliary", "adaptive practice": "yes", "sets domain": "Technological", "subsystem": "Water and soil", "subquestion": "SQ2", "description": "On-farm and sub-surface water retention: Freshmaker, ASR-Coastal, creek-ridge infiltration, and adjustable/smart drainage. Whether a farm decides a measure alone or with the water board is a question for a source.", "actor": "Arable farmers on Schouwen-Duiveland", "sources": "", "sourced": "no"}, {"id": "groundwater-extraction-for-irrigation", "label": "Groundwater extraction for irrigation", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Water and soil", "subquestion": "SQ2", "description": "Fresh water farmers pump from the lens through their own wells, to irrigate or to flush their fields in summer; the water board's pumping stations belong to drainage. Whose lens a well draws on, the farm's own or one it shares with its neighbours, so that a farm pumping less leaves water to them, is a hypothesis for the group model building session.", "actor": "Arable farmers on Schouwen-Duiveland", "sources": "", "sourced": "no"}, {"id": "policy-resistance-legal-delays", "label": "Objections to land-use plans", "element type": "Stock", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "Objections, appeals at the Council of State (Raad van State) and political pressure against plans for the island's water and land, the water board's water level plans among them, which slow, change or stop a plan.", "sources": "", "sourced": "no"}, {"id": "winter-rain-drained-away", "label": "Winter rain drained away", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Water and soil", "subquestion": "SQ1", "description": "Winter precipitation rapidly discharged to sea via field drains and pumping stations instead of recharging the lens.", "sources": "", "sourced": "no"}, {"id": "crop-yield", "label": "Crop yield", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subsystem": "Water and soil", "subquestion": "SQ1", "description": "Physical yield per hectare of conventional crops (potatoes, onions, sugar beet) under the prevailing freshwater, soil and workability conditions; what salt takes from their harvest is Harvest lost to salt.", "sources": "", "sourced": "no"}, {"id": "market-demand-for-alternative-crops", "label": "Market demand for alternative crops", "element type": "Constant", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "Consumer demand and offtake contracts for novel salt-tolerant or alternative crops (e.g. protein crops).", "sources": "", "sourced": "no"}, {"id": "processing-capacity-for-alternative-crops", "label": "Local processing capacity for new crops", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "Plants and supply chains on or near the island that store, process or sell new salt-tolerant crops. Breeding of tolerant varieties is Salt-tolerant varieties on offer.", "actor": "Buyers and processors of the island's crops", "sources": "", "sourced": "no"}, {"id": "salt-tolerant-crop-adoption", "label": "Adoption of new salt-tolerant crops", "element type": "Auxiliary", "adaptive practice": "yes", "sets domain": "Technological", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "Hectares under crops new to the island's rotations that tolerate salt (quinoa, samphire, sea aster, field beans), which need other machines, knowledge and buyers than the current crops.", "actor": "Arable farmers on Schouwen-Duiveland", "sources": "", "sourced": "no"}, {"id": "agricultural-land-value", "label": "Agricultural land value", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "The price farmland sells for (€/ha), set by what buyers expect it to earn; banks value it as collateral in their own risk assessment.", "sources": "", "sourced": "no"}, {"id": "bank-credit-freeze-risk-premiums", "label": "Risk premium on farm loans", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "The interest banks charge arable farms above their own funding cost, for the risk they see in the loan.", "actor": "Banks lending to the island's farmers", "sources": "", "sourced": "no"}, {"id": "basel-iv-capital-requirements", "label": "Basel IV capital requirements", "element type": "Constant", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "European banking regulations requiring stricter risk weighting on loans when climate/soil risks reduce collateral value.", "sources": "", "sourced": "no"}, {"id": "dependence-on-high-margin-salt-sensitive-crops", "label": "Dependence on high-margin salt-sensitive crops", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "The share of high-value, salt-sensitive cash crops (seed potatoes, onions) in the rotation, which a farm with high debt payments needs to keep up its income, and which the machines and know-how it would lose by switching tie it to.", "actor": "Arable farmers on Schouwen-Duiveland", "sources": "", "sourced": "no"}, {"id": "farm-revenue", "label": "Farm income", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "Farms' revenue from crop sales, set by yield and prices, minus their costs (the water board's levy, interest, their own pumping), per hectare in a year.", "sources": "", "sourced": "no"}, {"id": "farmers-capacity-to-invest", "label": "Farmers' capacity to invest", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "What a farm has left to invest after its debt payments and rent, beside the credit a bank will give it.", "sources": "", "sourced": "no"}, {"id": "fear-of-expropriation-planning-blight", "label": "Owners' concern about their land's value", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "Landowning farmers' concern that their land loses value, from a fall that has happened or from a plan that would lower it. A tenant's concern, losing the lease, is not part of it.", "sources": "", "sourced": "no"}, {"id": "mortgage-debt-financial-leverage", "label": "Financial leverage", "element type": "Stock", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "The farm's debt relative to the value of its assets, the inverse of its solvency (equity as a share of total capital). Land is 70% of an arable farm's balance sheet, so the ratio moves with the land price: arable farms' solvency was 81% in 2018 because their land had risen in value, while their long-term debt had tripled since 2001 to 770,000 euro per farm (van der Meulen et al., 2020).", "sources": "van der Meulen, H., van der Meer, R., & van Asseldonk, M. (2020). Financiering transitie naar duurzame landbouw: Inzicht in het huidige financieringslandschap en ontwikkelingen (Rapport 2020-097). Wageningen Economic Research. https://edepot.wur.nl/532092", "sourced": "yes"}, {"id": "farmland-leaving-arable-use", "label": "Arable land in the polders", "element type": "Stock", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ3", "description": "Hectares of the island's land farmed as arable land, with conventional or salt-tolerant crops, whoever owns it. It falls when land that changes hands goes to a holder who does not farm it as arable land; what the land becomes then (nature, grassland, water storage) waits for the group's system boundary.", "sources": "", "sourced": "no"}, {"id": "crop-water-shortfall", "label": "Crop water shortfall", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subsystem": "Water and soil", "subquestion": "SQ1", "description": "What crops need in the growing season beyond the water they get, fresh or brackish: the gap farmers' water decisions respond to.", "sources": "", "sourced": "no"}, {"id": "flushing-salt-from-the-root-zone", "label": "Flushing salt from the root zone", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Water and soil", "subquestion": "SQ2", "description": "Fresh water farmers put on a field to wash salt below the roots, pumped from the lens.", "actor": "Arable farmers on Schouwen-Duiveland", "sources": "", "sourced": "no"}, {"id": "freshwater-supply-route", "label": "Freshwater supply route to the island", "element type": "Stock", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Water and soil", "subquestion": "SQ1", "description": "Pipes or channels that could bring fresh water to the island, as their capacity in a summer; none exists. Who decides on one and who pays is on the facts list under External freshwater supply; news reports say the province has costed a pipeline (unread at the source).", "actor": "Provincie Zeeland", "sources": "", "sourced": "no"}, {"id": "water-available-for-supply-in-drought", "label": "Fresh water available for supply in drought", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subsystem": "Water and soil", "subquestion": "SQ1", "description": "River water that could reach a supply route to the island in a dry summer: what summer river discharge and the national distribution in drought (the verdringingsreeks, IenW and Rijkswaterstaat) leave for the region. Outside the CLD's scale.", "sources": "", "sourced": "no"}, {"id": "spring-workability-of-the-fields", "label": "Spring workability of the fields", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subsystem": "Water and soil", "subquestion": "SQ1", "description": "Whether heavy machinery can work the fields early in spring without damaging the soil, set by soil structure and by how wet the soil is.", "sources": "", "sourced": "no"}, {"id": "polder-drainage-depth", "label": "Polder drainage depth", "element type": "Stock", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Water and soil", "subquestion": "SQ2", "description": "How far below the surface the water board holds the ditch levels in the island's polders, as its water level plans (peilbesluiten) set them; it changes only when the board carries out a new plan.", "sources": "", "sourced": "no"}, {"id": "plans-to-raise-ditch-levels", "label": "Water board's plans to raise ditch levels", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Water and soil", "subquestion": "SQ2", "description": "Draft or adopted water level plans in which Waterschap Scheldestromen raises a polder's ditch levels, weighing farmers' demand against seepage, subsidence and its pumping costs.", "actor": "Waterschap Scheldestromen", "sources": "", "sourced": "no"}, {"id": "water-board-pumping-costs", "label": "Water board's pumping costs", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Water and soil", "subquestion": "SQ1", "description": "What Waterschap Scheldestromen spends on its pumping stations to hold the polders' ditch levels: more water to pump the deeper it drains, the more seepage and winter rain come in and the lower the land lies.", "sources": "", "sourced": "no"}, {"id": "water-board-levy-on-farmland", "label": "Water board levy on farmland", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "What the water board charges owners and users of farmland for its water management, pumping included.", "actor": "Waterschap Scheldestromen", "sources": "", "sourced": "no"}, {"id": "agricultural-seats-on-the-water-board", "label": "Agricultural seats on the water board", "element type": "Constant", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Water and soil", "subquestion": "SQ2", "description": "Seats on Waterschap Scheldestromen's general board reserved for agricultural landowners, through which farmers take part in its decisions (the session's understanding, unsourced: on the facts list under Demand for deep polder drainage).", "sources": "", "sourced": "no"}, {"id": "harvest-lost-to-salt", "label": "Harvest lost to salt", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Ecological", "subsystem": "Water and soil", "subquestion": "SQ1", "description": "The conventional crops' harvest that salt in the root zone takes, over the island's fields still under them.", "sources": "", "sourced": "no"}, {"id": "margin-given-up-on-high-margin-crops", "label": "Margin given up on high-margin crops", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "The margin a farm forgoes on fields it moves from its high-margin current crops to salt-tolerant ones, largest on fresh land, where the current crops still do well.", "sources": "", "sourced": "no"}, {"id": "attractiveness-of-storing-water", "label": "Relative attractiveness of storing water", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Water and soil", "subquestion": "SQ2", "description": "How worthwhile farmers find storing fresh water for the summer against their other ways through a dry summer (pumping, brackish water, other crops): whether a farm wants to, where capacity to invest is whether it can. Where stored water spreads under the neighbours, one farm pays and others gain: whether that holds a farm back is a question for the group model building session.", "sources": "", "sourced": "no"}, {"id": "farms-with-a-successor", "label": "Farms with a successor", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ3", "description": "Arable farms on the island whose farmer has someone to take the farm over.", "sources": "", "sourced": "no"}, {"id": "owner-farmed-arable-land", "label": "Arable land farmed by its owner", "element type": "Constant", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ3", "description": "The share of the island's arable land farmed by the farmer who owns it rather than leased. Whether the land market moves it by 2050 is a question for a source.", "sources": "", "sourced": "no"}, {"id": "harvest-of-new-crops-to-process", "label": "Harvest of new crops to process", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "The volume of new salt-tolerant crops within reach of a processing plant on or near the island, from the island's growers and from growers elsewhere.", "sources": "", "sourced": "no"}, {"id": "attractiveness-of-local-processing", "label": "Attractiveness of processing new crops locally", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "How worthwhile buyers and processors find building or keeping capacity for new crops on or near the island, against processing them elsewhere.", "sources": "", "sourced": "no"}, {"id": "net-price-for-new-crops", "label": "Net price for new crops after transport", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "What farmers on the island get for new salt-tolerant crops once transport to the processor is paid, set by processors on and off the island.", "sources": "", "sourced": "no"}, {"id": "growers-of-new-crops-elsewhere", "label": "Growers of new crops elsewhere", "element type": "Constant", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "Farmers off the island growing the same new crops, whose harvest a local plant could also process.", "sources": "", "sourced": "no"}, {"id": "processing-of-new-crops-elsewhere", "label": "Processing of new crops elsewhere", "element type": "Constant", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "Plants off the island that buy and process new salt-tolerant crops, which set the price the island's growers can get beside a local plant.", "sources": "", "sourced": "no"}, {"id": "tolerant-varieties-adoption", "label": "Adoption of salt-tolerant varieties", "element type": "Auxiliary", "adaptive practice": "yes", "sets domain": "Technological", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "Hectares under salt-tolerant varieties of the current crops (potato, onion), which use the same machines, storage and know-how.", "actor": "Arable farmers on Schouwen-Duiveland", "sources": "", "sourced": "no"}, {"id": "attractiveness-of-tolerant-varieties", "label": "Relative attractiveness of salt-tolerant varieties", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "How worthwhile farmers find a salt-tolerant variety against the variety they grow now: whether they want to switch.", "sources": "", "sourced": "no"}, {"id": "attractiveness-of-new-crops", "label": "Relative attractiveness of new salt-tolerant crops", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "How worthwhile farmers find a new salt-tolerant crop against their current crops: whether they want to switch, where capacity to invest is whether they can and dependence on the current crops what holds them.", "sources": "", "sourced": "no"}, {"id": "tolerant-varieties-on-offer", "label": "Salt-tolerant varieties on offer", "element type": "Constant", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "Salt-tolerant varieties of the current crops that breeders bring to market, and their yield; breeding lies outside the CLD's scale.", "sources": "", "sourced": "no"}, {"id": "machines-and-storage-for-current-crops", "label": "Machines and storage for the current crops", "element type": "Stock", "adaptive practice": "no", "sets domain": "Technological", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "The planters, harvesters and stores farms own for their current crops, built up over years and renewed when worn.", "sources": "", "sourced": "no"}, {"id": "know-how-of-current-crops", "label": "Know-how of the current crops", "element type": "Stock", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "What farmers know about growing, storing and selling their current crops, built up over years of growing them.", "sources": "", "sourced": "no"}, {"id": "capital-lost-on-switching", "label": "Capital lost on switching to new crops", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "The machines, storage and know-how a farm writes off when it moves fields to a new crop that cannot use them; what it keeps using or sells is not lost. Salt-tolerant varieties of the current crops lose little of it.", "sources": "", "sourced": "no"}, {"id": "knowledge-of-new-crops", "label": "Farmers' knowledge of new crops", "element type": "Stock", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "What the island's farmers know about growing and selling new salt-tolerant crops, from their own fields, their neighbours' and advisers.", "sources": "", "sourced": "no"}, {"id": "spending-on-keeping-current-crops", "label": "Spending on keeping the current crops", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion": "SQ2", "description": "What farms invest in carrying on with their current crops: wells and irrigation, drains, new machines and storage.", "actor": "Arable farmers on Schouwen-Duiveland", "sources": "", "sourced": "no"}, {"id": "banks-risk-assessment", "label": "Banks' risk assessment of farm loans", "element type": "Auxiliary", "adaptive practice": "no", "sets domain": "Social", "subsystem": "Agricultural economy", "subquestion"
